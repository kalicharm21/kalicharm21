<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
<title id="title">Animated ASCII cyberpunk terminal</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03060c"/><stop offset="1" stop-color="#101027"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#00f5d4"/><stop offset=".55" stop-color="#7b2cff"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
 <clipPath id="screen"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<g clip-path="url(#screen)">
 <rect width="1200" height="360" fill="url(#bg)"/>
 <g fill="#00f5a0" font-family="monospace" font-size="14" opacity=".72">
  <text x="20" y="-80">010101 01 101 0 0110<animate attributeName="y" values="-80;390" dur="7s" repeatCount="indefinite"/></text>
  <text x="120" y="-250">{ } ; / 0x01 101010<animate attributeName="y" values="-250;390" dur="9s" repeatCount="indefinite"/></text>
  <text x="230" y="-140">const sys = true;<animate attributeName="y" values="-140;390" dur="6.5s" repeatCount="indefinite"/></text>
  <text x="350" y="-300">1010 // INIT // 010<animate attributeName="y" values="-300;390" dur="8.5s" repeatCount="indefinite"/></text>
  <text x="470" y="-40">010101 {code} 001<animate attributeName="y" values="-40;390" dur="7.5s" repeatCount="indefinite"/></text>
  <text x="590" y="-210">while (build) { ship(); }<animate attributeName="y" values="-210;390" dur="10s" repeatCount="indefinite"/></text>
  <text x="730" y="-120">1011001 010101 0<animate attributeName="y" values="-120;390" dur="6.8s" repeatCount="indefinite"/></text>
  <text x="850" y="-270">$ git push origin main<animate attributeName="y" values="-270;390" dur="9.2s" repeatCount="indefinite"/></text>
  <text x="1000" y="-60">0xFF 1010 API 0110<animate attributeName="y" values="-60;390" dur="7.8s" repeatCount="indefinite"/></text>
 </g>
 <rect x="26" y="24" width="1148" height="312" rx="15" fill="#05070d" fill-opacity=".86" stroke="#00f5d4" stroke-opacity=".8"/>
 <path d="M26 63H1174" stroke="url(#neon)" stroke-width="2"/>
 <circle cx="49" cy="44" r="5" fill="#ff2e88"/><circle cx="67" cy="44" r="5" fill="#ffbd2e"/><circle cx="85" cy="44" r="5" fill="#00f5d4"/>
 <text x="106" y="49" fill="#9ca3af" font-family="monospace" font-size="13">ishaan@vit-bhopal: ~/profile</text>
 <g font-family="monospace" font-weight="700">
  <text x="58" y="112" fill="#00f5d4" font-size="24">root@ishaan:~$ whoami</text>
  <text x="58" y="153" fill="#e5e7eb" font-size="35">ISHAAN MITTAL</text>
  <text x="58" y="183" fill="#ff2e88" font-size="16">SOFTWARE ENGINEERING // AI &amp; ML</text>
  <text x="58" y="215" fill="#9ca3af" font-size="14">[ VIT BHOPAL ] [ CGPA 8.76/10 ] [ IEEE AUTHOR ]</text>
  <text x="58" y="260" fill="#00f5d4" font-size="17">$ build --systems --intelligence</text>
  <text x="58" y="288" fill="#d1d5db" font-size="14">> debug with intent; ship with purpose_</text>
 </g>
 <g transform="translate(865 95)" font-family="monospace" font-size="12" fill="#00f5d4">
  <text y="0">       .-=========-.</text><text y="18">      /  _     _  \</text><text y="36">     |  (o)   (o)  |</text><text y="54">     |     ___     |</text><text y="72">      \  '---'   /</text><text y="90">       '-._____.-'</text><text y="108">        /|     |\</text><text y="126">       / |_____| \</text><text y="144">      /  /     \  \</text><text y="162">     /__/       \__\</text>
 </g>
 <rect x="26" y="323" width="1148" height="13" fill="url(#neon)" opacity=".8"/>
</g></svg>
